trigger:
  - main

pool:
  vmImage: 'ubuntu-latest' # Runs on clean cloud hosted machine natively

variables:
  - group: vercel-credentials # Links your secret variables block here
  - name: IMAGE_NAME
    value: 'moviematch'

stages:
  - stage: DevSecOpsPipeline
    displayName: 'SonarQube, Docker, and Vercel Automation'
    jobs:
      - job: RunPipelineStages
        displayName: 'Execute Workflow Sequence'
        steps:
          # Step 1: Download code from GitHub
          - checkout: self
            displayName: 'Fetch Code'

          # Step 2: Initialize Node platform setup
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js Framework'

          # Step 3: Install pristine package blocks
          - script: |
              npm ci
            displayName: 'Install NPM Dependencies'

          # Step 4: SonarQube Scanner Code Analysis
          - script: |
              npx sonar-scanner \
                -Dsonar.projectKey=moviematch \
                -Dsonar.sources=src \
                -Dsonar.host.url=https://cylinder-jelly-wobbling.ngrok-free.dev \
                -Dsonar.login=sqa_2cd500a1de1864a811658d632dc9a381fde6d094
            displayName: 'SonarQube Code Analysis'

          # Step 5: Login to Docker Hub Cloud Container Engine
          - script: |
              echo "$(DOCKER_HUB_PASSWORD)" | docker login -u "$(DOCKER_HUB_USER)" --password-stdin
            displayName: 'Authenticate with Docker Hub Container Registry'

          # Step 6: Compile production image container tag
          - script: |
              docker build -t $(DOCKER_HUB_USER)/$(IMAGE_NAME):$(Build.BuildId) .
            displayName: 'Compile Production Docker Image'

          # Step 7: Push build tag cleanly to Docker Hub Account Profile
          - script: |
              docker push $(DOCKER_HUB_USER)/$(IMAGE_NAME):$(Build.BuildId)
            displayName: 'Push Container Image to Docker Hub'

          # Step 8: Execute Vercel Production Deploy smoothly using dynamic variables
          - script: |
              npx vercel --token=$(VERCEL_TOKEN) --prod --yes --env VERCEL_ORG_ID=$(VERCEL_ORG_ID) --env VERCEL_PROJECT_ID=$(VERCEL_PROJECT_ID)
            displayName: 'Execute Automated Vercel Deploy'